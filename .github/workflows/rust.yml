name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI only needs to read the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml. Only the library is built:
      # dev-dependencies (criterion) need a newer toolchain. The version is an input
      # rather than the action's ref so Dependabot doesn't "update" it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83"
      - run: cargo build --lib --locked
