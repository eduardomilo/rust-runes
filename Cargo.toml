[package]
name = "rust-runes"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A rule engine compatible with Grule's rule language (GRL) and execution model"
license = "MIT"
repository = "https://github.com/eduardomilo/rust-runes"
readme = "README.md"
keywords = ["rules", "rule-engine", "grule", "grl", "business-rules"]
exclude = [".github/", ".vscode/", "CLAUDE.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
pest = "2.7"
pest_derive = "2.7"
chrono = { version = "0.4.35", features = ["serde"] }
libm = "0.2"
regex = "1"
log = "0.4"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "grule_comparison"
harness = false
